description: YOLO11n (1 clase 'persona') compilado para Hailo-8 a partir de best.pt
author: Ultralytics
version: 8.4.115
license: AGPL-3.0 License (https://ultralytics.com/license)
docs: https://docs.ultralytics.com
stride: 32
task: detect
head: Detect
batch: 1
imgsz:
- 640
- 640
names:
  0: persona
args:
  batch: 1
  nms: true
channels: 3
# nms: true -> el .hef lleva la NMS incrustada (on-chip). Es lo que genera
# el Hailo Model Zoo / DFC para YOLOv8-YOLO11 de deteccion, y encaja con lo
# visto en el .hef anterior (devolvia indices de clase directos). Ultralytics
# usa entonces el decode _decode_nms (salida ya en cajas).
# Si en la Pi salen 0 detecciones o un error dentro de _decode_nms, cambia a
# nms: false. Para confirmarlo sin adivinar:
#   hailortcli parse-hef weights/best_hailo_model/best.hef
#   -> si hay una capa 'nms_postprocess' es true; si son salidas HxWxC es false.
nms: true
end2end: true
